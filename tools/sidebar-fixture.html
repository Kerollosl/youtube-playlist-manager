<!doctype html>
<html lang="en" dark>
<meta charset="utf-8">
<title>YouTube sidebar — integration fixture</title>
<style>
  html{--yt-spec-text-primary:#0f0f0f;--yt-spec-base-background:#fff;--yt-spec-10-percent-layer:#0000000d;--yt-spec-call-to-action:#065fd4}
  html[dark]{--yt-spec-text-primary:#f1f1f1;--yt-spec-base-background:#0f0f0f;--yt-spec-10-percent-layer:#ffffff1a;--yt-spec-call-to-action:#3ea6ff}
  body{margin:0;background:var(--yt-spec-base-background);color:var(--yt-spec-text-primary);font:14px Roboto,Arial,sans-serif}
  header{height:56px;display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:bold}
  ytd-mini-guide-renderer{display:block;position:fixed;top:56px;bottom:0;width:64px;padding:0 4px}
  ytd-mini-guide-renderer #items{display:flex;flex-direction:column;margin-top:4px}
  .native-link{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex-shrink:0;width:64px;height:76px;border-radius:10px;color:inherit;text-decoration:none;font:10px/16px Roboto,Arial,sans-serif}
  .native-link b{font-size:24px;line-height:24px;font-weight:400}
  .native-link:hover{background:var(--yt-spec-10-percent-layer)}
  main{margin:36px 100px;max-width:650px}button{font:inherit;color:inherit;background:var(--yt-spec-10-percent-layer);border:0;border-radius:18px;padding:10px 16px;margin:4px;cursor:pointer}
  ytd-guide-renderer{display:block;margin-top:24px}ytd-guide-renderer a{display:block;color:inherit;margin:12px 0}
</style>
<link rel="stylesheet" href="/src/page.css">
<header>▶ YouTube <span style="font-size:12px;margin-left:20px">Synthetic sidebar fixture</span><ytd-masthead><div id="end"></div></ytd-masthead></header>
<ytd-mini-guide-renderer role="navigation" aria-label="Compact sidebar"><div id="items"></div></ytd-mini-guide-renderer>
<main>
  <h1>Sidebar shortcuts</h1>
  <p>History, Playlists, and Watch Later should appear above You.</p>
  <button id="rerender">Rerender compact sidebar</button>
  <button id="native">Toggle native compact shortcuts</button>
  <button id="theme">Toggle theme</button>
  <button id="home">Navigate home</button>
  <button id="feed-render">Simulate feed rerender</button>
  <button id="burst">Burst active feed renders</button>
  <p>The expanded guide supplies native routes, reused without reloading:</p>
  <ytd-guide-renderer><a href="/feed/history">History</a><a href="/feed/playlists">Playlists</a><a href="/playlist?list=WL">Watch later</a></ytd-guide-renderer>
  <section id="feed" hidden></section>
</main>
<script>
  window.chrome = { runtime: { getURL: path => '/' + path, onMessage: { addListener() {} }, sendMessage: async message => ({ok:true,history:[],complete:true,playlistId:message.playlistId,items:[]}) } };
  const queryAll = document.querySelectorAll.bind(document);
  document.documentElement.dataset.rowScans = '0';
  document.documentElement.dataset.nativeNavigations = '0';
  document.querySelectorAll = selector => {
    if (selector === 'ytd-page-manager > *' || selector === 'ytd-browse') document.documentElement.dataset.rowScans = String(Number(document.documentElement.dataset.rowScans) + 1);
    return queryAll(selector);
  };
  for (const link of document.querySelectorAll('ytd-guide-renderer a')) link.onclick = event => {
    event.preventDefault(); history.pushState(null,'',link.href);
    document.documentElement.dataset.nativeNavigations = String(Number(document.documentElement.dataset.nativeNavigations) + 1);
    document.dispatchEvent(new Event('yt-navigate-finish'));
  };
  let includeNative = false;
  function renderSidebar() {
    const items = document.querySelector('ytd-mini-guide-renderer #items');
    const entries = [['Home','/','⌂'],['Shorts','/shorts/','▷'],['Subscriptions','/feed/subscriptions','▣'],['You','/feed/you','◎']];
    if (includeNative) entries.splice(3,0,['History','/feed/history','↶'],['Playlists','/feed/playlists','☷'],['Watch Later','/playlist?extra=1&list=WL','◷']);
    const injected = [...items.querySelectorAll('.yt-multiselect-sidebar-link')];
    items.replaceChildren(...entries.map(([label,href,icon]) => {
      const a = document.createElement('a'); a.href = href; a.className = 'native-link';
      const b = document.createElement('b'); b.textContent = icon; b.setAttribute('aria-hidden','true');
      const span = document.createElement('span'); span.textContent = label; a.append(b,span);
      const entry = document.createElement('ytd-mini-guide-entry-renderer'); entry.append(a); return entry;
    }), ...injected);
  }
  document.getElementById('rerender').onclick = renderSidebar;
  document.getElementById('native').onclick = () => { includeNative = !includeNative; renderSidebar(); };
  document.getElementById('theme').onclick = () => document.documentElement.toggleAttribute('dark');
  document.getElementById('home').onclick = () => { history.pushState(null,'','/tools/sidebar-fixture.html'); document.dispatchEvent(new Event('yt-navigate-finish')); };
  document.getElementById('feed-render').onclick = () => document.getElementById('feed').replaceChildren(...Array.from({length:100},() => document.createElement('ytd-rich-item-renderer')));
  document.getElementById('burst').onclick = () => {
    const feed = document.getElementById('feed'), started = performance.now();
    const row = document.createElement('ytd-video-renderer'), a = document.createElement('a');
    a.id = 'video-title'; a.href = '/watch?v=abcdefghijk'; a.textContent = 'Synthetic video'; row.append(a);
    feed.hidden = false; feed.replaceChildren(row);
    document.documentElement.dataset.firstWiredMs = '';
    document.documentElement.dataset.burstDone = 'false';
    const watcher = new MutationObserver(() => {
      if (row.querySelector('.yt-multiselect-checkbox')) { document.documentElement.dataset.firstWiredMs = String(Math.round(performance.now() - started)); watcher.disconnect(); }
    });
    watcher.observe(row,{childList:true});
    let renders = 0;
    const burst = setInterval(() => {
      const span = document.createElement('span'); span.textContent = ' ·'; row.append(span);
      if (++renders === 20) { clearInterval(burst); document.documentElement.dataset.burstDone = 'true'; }
    },30);
  };
  renderSidebar();
</script>
<script src="/src/content.js"></script>
</html>
