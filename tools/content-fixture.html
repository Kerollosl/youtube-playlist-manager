<!doctype html>
<html lang="en" dark>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Multiselect — integration fixture</title>
  <style>
    :root{--yt-spec-text-primary:#f1f1f1;--yt-spec-text-secondary:#aaa;--yt-spec-base-background:#0f0f0f;--yt-spec-raised-background:#282828;--yt-spec-10-percent-layer:#ffffff1a;--yt-spec-call-to-action:#3ea6ff;--yt-spec-badge-chip-background:#ffffff1a}
    body{font:14px Roboto,Arial,sans-serif;margin:0;background:#0f0f0f;color:#f1f1f1}
    ytd-masthead{display:block;padding:12px 24px;border-bottom:1px solid #222;height:66px}
    #end{display:flex;align-items:center;float:right}
    #buttons{padding:0 15px}
    h1{font-size:28px;font-weight:500;margin:0 0 16px}
    .layout{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:40px 60px}
    .summary{background:#272727;border-radius:14px;padding:24px}
    .summary p{color:#aaa}
    ytd-playlist-video-renderer{display:flex;align-items:center;gap:20px;min-height:126px;margin-bottom:12px;padding:10px 40px;border-radius:8px}
    ytd-playlist-video-renderer:hover{background:#ffffff0a}
    .thumb{width:190px;height:106px;background:#263c50;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:36px;color:#7da4ca}
    .meta{flex:1}
    a{color:inherit;text-decoration:none;font-size:17px;font-weight:500}
    #byline-container{color:#aaa;margin-top:10px}
    button{color:inherit;background:#ffffff1a;border:0;padding:9px 14px;border-radius:20px;font:inherit;cursor:pointer}
    #results{color:#90c9ff;white-space:pre-wrap;font-size:13px;min-height:44px}
    .fixture-controls{padding:18px 60px;border-top:1px solid #333;color:#aaa}
    #index{color:#777}
  </style>
  <link rel="stylesheet" href="fixture-responsive.css">
  <link rel="stylesheet" href="../src/page.css">
</head>
<body>
  <ytd-masthead>
    <span style="font-size:21px;font-weight:bold;line-height:40px">▶ YouTube</span>
    <div id="end"><div id="buttons">＋ Create　 ◯</div></div>
  </ytd-masthead>
  <main class="layout">
    <aside class="summary">
      <div class="thumb" style="width:100%;height:145px;margin-bottom:25px">▶</div>
      <h1>Watch later</h1>
      <p>Demo playlist · 2 videos</p>
      <p>Synthetic data for interface testing</p>
    </aside>
    <section>
      <ytd-playlist-video-list-renderer id="rows">
        <ytd-playlist-video-renderer>
          <span id="index">1</span><div class="thumb">▶</div>
          <div class="meta"><a id="video-title" href="https://www.youtube.com/watch?v=abcdefghijk&amp;list=WL&amp;index=1">Building useful tools</a><div id="byline-container">Build Notes</div></div>
        </ytd-playlist-video-renderer>
        <ytd-playlist-video-renderer>
          <span id="index">2</span><div class="thumb" style="background:#3b3430;color:#bc947d">▶</div>
          <div class="meta"><a id="video-title" href="https://www.youtube.com/watch?v=lmnopqrstuv&amp;list=WL&amp;index=2">Learning every day</a><div id="byline-container">Open Classroom</div></div>
        </ytd-playlist-video-renderer>
      </ytd-playlist-video-list-renderer>
    </section>
  </main>
  <div class="fixture-controls">
    <button id="rerender">Rerender playlist rows</button>
    <p>Captured clipboard output (test only):</p>
    <pre id="results">No links copied yet.</pre>
  </div>
  <script src="fixture-runtime.js?v=1.6.1"></script>
  <script src="../src/content.js?v=1.6.1"></script>
</body>
</html>
